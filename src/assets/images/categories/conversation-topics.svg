<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Conversation topics">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2C1D12"/>
      <stop offset="55%" stop-color="#56392A"/>
      <stop offset="100%" stop-color="#946445"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFE6BF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFE6BF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>
  <!-- Ambient bokeh -->
  <g filter="url(#blur)" opacity="0.55">
    <circle cx="220" cy="180" r="120" fill="#C58A47"/>
    <circle cx="980" cy="640" r="160" fill="#C58A47" opacity="0.7"/>
    <circle cx="640" cy="120" r="60" fill="#FFE6BF"/>
    <circle cx="1080" cy="240" r="80" fill="#FFE6BF" opacity="0.8"/>
  </g>
  <!-- Coffee cup silhouette -->
  <g transform="translate(420 280)" opacity="0.92">
    <ellipse cx="180" cy="40" rx="170" ry="36" fill="#1F140C" opacity="0.35"/>
    <path d="M20 30 Q20 320 180 320 Q340 320 340 30 Z" fill="#3F2A1C"/>
    <path d="M340 90 Q430 90 430 170 Q430 250 340 250" fill="none" stroke="#3F2A1C" stroke-width="22" stroke-linecap="round"/>
    <ellipse cx="180" cy="30" rx="160" ry="30" fill="#6B4226"/>
    <ellipse cx="180" cy="28" rx="130" ry="20" fill="#946445"/>
    <!-- steam -->
    <path d="M120 -40 Q140 -70 120 -100 Q100 -130 120 -160" stroke="#FBF7F0" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M180 -50 Q200 -80 180 -110 Q160 -140 180 -170" stroke="#FBF7F0" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M240 -40 Q260 -70 240 -100 Q220 -130 240 -160" stroke="#FBF7F0" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>
  <!-- Title overlay (subtle) -->
  <text x="60" y="740" font-family="Georgia, serif" font-size="28" fill="#FBF7F0" opacity="0.55">Conversation topics</text>
</svg>
